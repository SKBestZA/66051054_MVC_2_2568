<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ระบบเยียวยาเกษตรกร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="fas fa-seedling"></i> ระบบเยียวยา</a>
            <span class="navbar-text text-white">
                ผู้ใช้งาน: {{ username }} | <a href="/logout" class="text-danger"
                    style="text-decoration: none;">ออกจากระบบ</a>
            </span>
        </div>
    </nav>

    <div class="container">
        {% if msg_type %}
        <div class="alert alert-{{ msg_type }} alert-dismissible fade show" role="alert">
            <strong>{{ msg_title }}</strong> {{ msg_text }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
