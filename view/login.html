{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="fas fa-lock"></i> เข้าสู่ระบบ</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}

                <form action="/login" method="post">
                    <div class="mb-3">
                        <label class="form-label">ชื่อผู้ใช้ / รหัสผู้ขอเยียวยา</label>
                        <input type="text" name="username" class="form-control" required autofocus
                            placeholder="admin หรือ 1, 2, 3, ...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">รหัสผ่าน</label>
                        <input type="password" name="password" class="form-control" required placeholder="รหัสผ่าน">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                    </button>
                </form>

                <hr>
                <div class="text-center">
                    <small class="text-muted">
                        <strong>🔑 ข้อมูลทดสอบ:</strong><br>
                        <span class="badge bg-primary">เจ้าหน้าที่</span> admin / 1234<br>
                        <span class="badge bg-success">ประชาชน</span> ใช้รหัสผู้ขอเยียวยา (เช่น 1 / 1, 2 / 2)
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
